name: sky_tracker
description: "SkyTrack – Live Flight Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  get: ^4.6.6

  # HTTP Client
  dio: ^5.7.0

  # Local Storage
  get_storage: ^2.1.1

  # Maps (configure API key in AndroidManifest.xml)
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1

  # Utilities
  intl: ^0.20.1
  logger: ^2.4.0
  flutter_dotenv: ^5.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
    - .env
